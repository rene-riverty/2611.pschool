<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BU Collection · Now / Next / Later roadmap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --card: #21262d;
      --card-hover: #262c36;
      --border: #30363d;
      --text: #f0f6fc;
      --muted: #8b949e;
      --now: #4ade80;
      --next: #60a5fa;
      --later: #9ca3af;
      --cut: #fb7185;
      --qw: #4ade80;
      --bb: #60a5fa;
      --fi: #d2a86a;
      --mp: #fb7185;
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      background: var(--bg);
      line-height: 1.45;
    }

    .wrap {
      width: min(1120px, calc(100% - 2.5rem));
      margin: 0 auto;
      padding: 2.25rem 0 3rem;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 0.9rem 1.1rem;
      margin-bottom: 1.75rem;
    }

    .step {
      display: inline-flex;
      align-items: center;
      background: var(--now);
      color: #04110a;
      font-size: 0.82rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 0.38rem 0.85rem;
      white-space: nowrap;
      margin-top: 0.2rem;
    }

    .titles h1 {
      margin: 0;
      font-size: clamp(1.45rem, 2.8vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .titles p {
      margin: 0.35rem 0 0;
      color: var(--text);
      font-size: 0.98rem;
      opacity: 0.92;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin: 0 0 1.25rem;
    }

    .toolbar button {
      appearance: none;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 0.4rem 0.8rem;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .toolbar button:hover {
      color: var(--text);
      border-color: #484f58;
    }

    .toolbar button[aria-pressed="true"] {
      background: var(--card);
      color: var(--text);
      border-color: #484f58;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      align-items: stretch;
    }

    @media (max-width: 900px) {
      .board { grid-template-columns: 1fr; }
    }

    .lane {
      background: var(--panel);
      border: 1px solid var(--border);
      border-top-width: 3px;
      border-radius: var(--radius);
      padding: 1rem 1rem 1.05rem;
      min-height: 100%;
    }

    .lane[data-lane="NOW"] { border-top-color: var(--now); }
    .lane[data-lane="NEXT"] { border-top-color: var(--next); }
    .lane[data-lane="LATER"] { border-top-color: var(--later); }

    .lane-head {
      margin-bottom: 0.95rem;
    }

    .lane-head h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .lane-head small {
      display: block;
      margin-top: 0.28rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .lane[data-lane="NOW"] .lane-head small { color: var(--now); }
    .lane[data-lane="NEXT"] .lane-head small { color: var(--next); }
    .lane[data-lane="LATER"] .lane-head small { color: var(--later); }

    .cards {
      display: grid;
      gap: 0.75rem;
    }

    .card {
      background: var(--card);
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 0.9rem 0.95rem;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
      outline: none;
    }

    .card:hover,
    .card:focus-visible {
      background: var(--card-hover);
      border-color: #3a424c;
      transform: translateY(-1px);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.6rem;
      margin-bottom: 0.35rem;
    }

    .card h3 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
    }

    .badge {
      flex: 0 0 auto;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 0.22rem 0.48rem;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .badge.qw { color: var(--qw); background: rgba(74, 222, 128, 0.12); border-color: rgba(74, 222, 128, 0.28); }
    .badge.bb { color: var(--next); background: rgba(96, 165, 250, 0.12); border-color: rgba(96, 165, 250, 0.28); }
    .badge.fi { color: var(--fi); background: rgba(210, 168, 106, 0.12); border-color: rgba(210, 168, 106, 0.28); }
    .badge.mp { color: var(--cut); background: rgba(251, 113, 133, 0.12); border-color: rgba(251, 113, 133, 0.28); }

    .rationale {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card.is-open .rationale {
      display: block;
      -webkit-line-clamp: unset;
    }

    .meta-row {
      display: none;
      margin-top: 0.7rem;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .card.is-open .meta-row { display: flex; }

    .score {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.18rem 0.48rem;
    }

    .cut {
      margin-top: 1.15rem;
      border: 1.5px dashed rgba(251, 113, 133, 0.55);
      border-radius: var(--radius);
      padding: 1.05rem 1.15rem 1.15rem;
      background: rgba(251, 113, 133, 0.03);
    }

    .cut-head {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 0.85rem;
      color: var(--cut);
      font-weight: 700;
      letter-spacing: 0.06em;
      font-size: 0.92rem;
    }

    .cut-head .icon {
      font-size: 1rem;
      line-height: 1;
    }

    .cut-list {
      display: grid;
      gap: 0.85rem;
    }

    .cut-item {
      cursor: pointer;
      outline: none;
      border-radius: 8px;
      padding: 0.15rem 0.1rem;
    }

    .cut-item:hover,
    .cut-item:focus-visible {
      background: rgba(251, 113, 133, 0.06);
    }

    .cut-item .title {
      color: var(--text);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .cut-item .why {
      color: #b1a0a4;
      font-weight: 400;
      font-size: 0.9rem;
    }

    .cut-item .badge-wrap {
      display: inline-flex;
      margin-left: 0.45rem;
      vertical-align: 2px;
    }

    .is-hidden { display: none !important; }

    .legend {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.1rem;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="step">Step 4 · Roadmap</div>
      <div class="titles">
        <h1>Your Now / Next / Later roadmap</h1>
        <p>BU Collection · Team of 6</p>
      </div>
    </header>

    <div class="toolbar" role="toolbar" aria-label="Filter lanes">
      <button type="button" data-filter="ALL" aria-pressed="true">All</button>
      <button type="button" data-filter="NOW" aria-pressed="false">NOW</button>
      <button type="button" data-filter="NEXT" aria-pressed="false">NEXT</button>
      <button type="button" data-filter="LATER" aria-pressed="false">LATER</button>
      <button type="button" data-filter="CUT" aria-pressed="false">Cut list</button>
    </div>

    <section class="board" id="board">
      <div class="lane" data-lane="NOW">
        <div class="lane-head">
          <h2>NOW</h2>
          <small>This sprint</small>
        </div>
        <div class="cards" data-slot="NOW"></div>
      </div>
      <div class="lane" data-lane="NEXT">
        <div class="lane-head">
          <h2>NEXT</h2>
          <small>The following sprints</small>
        </div>
        <div class="cards" data-slot="NEXT"></div>
      </div>
      <div class="lane" data-lane="LATER">
        <div class="lane-head">
          <h2>LATER</h2>
          <small>Backlog</small>
        </div>
        <div class="cards" data-slot="LATER"></div>
      </div>
    </section>

    <section class="cut" data-lane="CUT" id="cut-list">
      <div class="cut-head"><span class="icon" aria-hidden="true">✂</span> CUT LIST</div>
      <div class="cut-list" data-slot="CUT"></div>
    </section>

    <div class="legend">
      <span>Quick win · V≥4 / E≤2</span>
      <span>Big bet · V≥4 / E≥3</span>
      <span>Fill-in · V≤3 / E≤2</span>
      <span>Money pit · V≤3 / E≥3</span>
    </div>
  </div>

  <script>
    const FEATURES = [
      {
        id: "B4",
        lane: "NOW",
        name: "Handoff summary for the agent when a consumer calls",
        rationale: "Direct test of the hypothesis; attacks 69.7% repeated checks.",
        value: 5,
        effort: 2
      },
      {
        id: "B2",
        lane: "NOW",
        name: "Plain explainer for why income is asked",
        rationale: "Cheap; cuts Mara freeze + top call reason before Daniel is needed.",
        value: 4,
        effort: 1
      },
      {
        id: "B5",
        lane: "NEXT",
        name: "Mobile photo upload / skip under threshold",
        rationale: "Hits largest in-journey leak (Income doc→Plan −22%).",
        value: 4,
        effort: 3
      },
      {
        id: "B1",
        lane: "NEXT",
        name: "One plan for several open claims",
        rationale: "Multi-claim = 40–43% agent contact; biggest segment pain, heavier build.",
        value: 5,
        effort: 4
      },
      {
        id: "B3",
        lane: "LATER",
        name: "Affordability check before plan options",
        rationale: "Supports keepability after handoff works; not the first gap to close.",
        value: 4,
        effort: 3
      },
      {
        id: "B6",
        lane: "LATER",
        name: "Pick a payment date that matches pay day",
        rationale: "Nice keepability tweak; weak link to Daniel’s blind-handoff metric.",
        value: 3,
        effort: 2
      },
      {
        id: "B8",
        lane: "CUT",
        name: "Chat assistant on every portal page",
        rationale: "Raises agree but already lifts miss risk; volume, not sustainable handoff.",
        value: 2,
        effort: 4
      },
      {
        id: "B7",
        lane: "CUT",
        name: "Show the shortest plan first to raise recovery",
        rationale: "Month-4 default already hurt keepability (miss 15.6%→19%); anti-hypothesis.",
        value: 1,
        effort: 1
      }
    ];

    function quadrant(feature) {
      const highValue = feature.value >= 4;
      const lowEffort = feature.effort <= 2;
      if (highValue && lowEffort) return { key: "qw", label: "Quick win" };
      if (highValue && !lowEffort) return { key: "bb", label: "Big bet" };
      if (!highValue && lowEffort) return { key: "fi", label: "Fill-in" };
      return { key: "mp", label: "Money pit" };
    }

    function cardHTML(feature) {
      const q = quadrant(feature);
      return `
        <article class="card" tabindex="0" role="button" aria-expanded="false"
          data-lane="${feature.lane}"
          aria-label="${feature.id}: ${feature.name}">
          <div class="card-top">
            <h3>${feature.id} - ${feature.name}</h3>
            <span class="badge ${q.key}">${q.label}</span>
          </div>
          <p class="rationale">${feature.rationale}</p>
          <div class="meta-row">
            <span class="score">Value ${feature.value}/5</span>
            <span class="score">Effort ${feature.effort}/5</span>
          </div>
        </article>
      `;
    }

    function cutHTML(feature) {
      const q = quadrant(feature);
      return `
        <div class="cut-item" tabindex="0" role="button" aria-label="${feature.id} cut item">
          <span class="title">${feature.id} - ${feature.name}</span><span class="badge-wrap"><span class="badge ${q.key}">${q.label}</span></span>
          <div class="why">${feature.rationale}</div>
        </div>
      `;
    }

    function bindToggle(el) {
      const toggle = () => el.classList.toggle("is-open");
      el.addEventListener("click", toggle);
      el.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          toggle();
        }
      });
    }

    function render() {
      ["NOW", "NEXT", "LATER"].forEach((lane) => {
        const root = document.querySelector(`[data-slot="${lane}"]`);
        root.innerHTML = FEATURES.filter((f) => f.lane === lane).map(cardHTML).join("");
      });
      document.querySelector('[data-slot="CUT"]').innerHTML =
        FEATURES.filter((f) => f.lane === "CUT").map(cutHTML).join("");

      document.querySelectorAll(".card, .cut-item").forEach(bindToggle);
    }

    function setFilter(filter) {
      document.querySelectorAll(".toolbar button").forEach((btn) => {
        btn.setAttribute("aria-pressed", String(btn.dataset.filter === filter));
      });

      document.querySelectorAll(".lane, .cut").forEach((section) => {
        const lane = section.dataset.lane;
        if (filter === "ALL") {
          section.classList.remove("is-hidden");
        } else {
          section.classList.toggle("is-hidden", lane !== filter);
        }
      });

      if (filter === "CUT") {
        document.getElementById("cut-list").scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    document.querySelectorAll(".toolbar button").forEach((btn) => {
      btn.addEventListener("click", () => setFilter(btn.dataset.filter));
    });

    render();
  </script>
</body>
</html>
